[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-ad-greeks"
version = "0.1.0"
description = "Research framework for Monte Carlo pricing sensitivities with JAX automatic differentiation"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib"
]

[project.scripts]
mcadgreeks = "mcadgreeks.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
