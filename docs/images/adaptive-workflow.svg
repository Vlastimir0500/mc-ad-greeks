63F" stroke-width="2"/><path d="M 1208 152 L 1215 158 L 1208 164" fill="none" stroke="#11263F" stroke-width="2"/><rect x="1218" y="82" width="214" height="150" rx="16" fill="#E8FAFD" stroke="#29B6D1" stroke-width="1.5" /><text x="1325.0" y="117" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#29B6D1" font-weight="800" text-anchor="middle" >6 · Production</text><text x="1325.0" y="158" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#213449" font-weight="500" text-anchor="middle"><tspan x="1325.0" dy="0">Fresh paths, estimate,</tspan><tspan x="1325.0" dy="25">SE + timing JSON</tspan></text><text x="20" y="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#11263F" font-weight="800" text-anchor="start" >ADAPTIVE ESTIMATOR PIPELINE</text><text x="20" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#587086" font-weight="500" text-anchor="start" >Validity and efficiency are different questions: a low empirical score cannot make an inapplicable estimator valid.</text></svg>