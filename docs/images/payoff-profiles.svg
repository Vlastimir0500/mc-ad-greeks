<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-label="Supported payoff profiles"><defs><linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D223A"/><stop offset="1" stop-color="#153B61"/></linearGradient><linearGradient id="bluefade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4FF"/><stop offset="1" stop-color="#F8FBFF"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17334D" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1440" height="430" rx="0" fill="#F7FAFD" stroke="#F7FAFD" stroke-width="0" /><text x="28" y="40" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#11263F" font-weight="800" text-anchor="start" >SUPPORTED PAYOFF PROFILES</text><rect x="24" y="70" width="445" height="325" rx="14" fill="#FFFFFF" stroke="#DCE6EF" stroke-width="1.3" /><rect x="497" y="70" width="445" height="325" rx="14" fill="#FFFFFF" stroke="#DCE6EF" stroke-width="1.3" /><rect x="970" y="70" width="445" height="325" rx="14" fill="#FFFFFF" stroke="#DCE6EF" stroke-width="1.3" /><text x="44" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#11263F" font-weight="750" text-anchor="start" >European call</text><text x="44" y="131" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#1677E8" font-weight="700" text-anchor="start" >e⁻ʳᵀ max(Sₜ − K, 0)</text><line x1="79" y1="315" x2="429" y2="315" stroke="#8BA0B5" stroke-width="1.7"/><line x1="79" y1="173" x2="79" y2="315" stroke="#8BA0B5" stroke-width="1.7"/><polyline points="82,315 254,315 429,178" fill="none" stroke="#1677E8" stroke-width="4" stroke-linecap="round"/><line x1="254" y1="307" x2="254" y2="323" stroke="#E98427" stroke-width="2" stroke-dasharray="4 4"/><text x="254" y="341" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#587086" font-weig